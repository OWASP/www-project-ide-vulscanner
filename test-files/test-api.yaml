openapi: 3.0.0
info:
  title: Sample API
  version: "1.0"
  description: "This is a test API to validate Spectral rules."
servers:
  - url: "http://api.example.com"  # This should trigger the 'insecure-api' rule

paths:
  /xss-test:
    get:
      summary: "Test XSS Prevention"
      responses:
        "200":
          description: "This response should trigger XSS detection."
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "<script>alert('XSS')</script>"

  /login:
    post:
      summary: "Login user"
      parameters:
        - name: apiKey
          in: query  # Should trigger 'api-key-leak'
          schema:
            type: string
