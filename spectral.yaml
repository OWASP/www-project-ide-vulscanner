rules:
  api-key-leak:
    description: "Detects hardcoded API keys"
    severity: "error"  # ✅ Valid severity
    given: "$.components.securitySchemes.*"
    then:
      function: pattern
      functionOptions:
        match: "^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{16,}$"

  xss-detection:
    description: "Detects potential XSS vulnerabilities"
    severity: "warn"  # ✅ Valid severity
    given: "$.paths..parameters[?(@.in == 'query' || @.in == 'body')]"
    then:
      function: pattern
      functionOptions:
        notMatch: "<script>.*</script>"

  sql-injection:
    description: "Detects possible SQL injection patterns"
    severity: "error"  # ✅ Valid severity
    given: "$.paths..parameters[?(@.in == 'query')]"
    then:
      function: pattern
      functionOptions:
        notMatch: "(?i)union select|drop table|insert into|--"
