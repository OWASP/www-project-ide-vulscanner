extends: [[spectral:oas, off]]  # Disables default rules to avoid conflicts

rules:
  info-description:
    description: "Every API should have an info description."
    given: "$.info"
    severity: error
    then:
      field: description
      function: truthy

  security-schemes:
    description: "Security schemes must be defined properly."
    given: "$.components.securitySchemes"
    severity: error
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            type:
              type: string
              enum: [apiKey, http, oauth2, openIdConnect]

  xss-prevention:
    description: "Ensure API responses are sanitized to prevent XSS attacks."
    given: "$..responses..content..schema.properties.*"
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: "(?i).*<script>.*"

  sql-injection-check:
    description: "Detect potential SQL injection risks in API requests."
    given: "$..parameters[?(@.in=='query' || @.in=='body')].name"
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: ".*([Ss][Ee][Ll][Ee][Cc][Tt]|[Ii][Nn][Ss][Ee][Rr][Tt]|[Uu][Pp][Dd][Aa][Tt][Ee]|[Dd][Ee][Ll][Ee][Tt][Ee]|[Dd][Rr][Oo][Pp]|[Uu][Nn][Ii][Oo][Nn]).*"
